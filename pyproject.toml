[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reolink-camera-control"
dynamic = ["version"]
description = "Python library to control Reolink cameras over their HTTP API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "H-Held" }]
keywords = ["reolink", "camera", "ip-camera", "api"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Topic :: Home Automation",
]
dependencies = [
    "requests>=2.25",
    "reolink-aio>=0.21,<0.22",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.dynamic]
version = { attr = "reolink_camera_control.__version__" }

[tool.setuptools.packages.find]
include = ["reolink_camera_control*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
